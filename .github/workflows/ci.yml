name: CI

on:
  push:
    branches: [main, ci]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect environment
    runs-on: ubuntu-24.04

    steps:
      - name: Show runner information
        run: |
          uname -a
          cmake --version
          python3 --version
